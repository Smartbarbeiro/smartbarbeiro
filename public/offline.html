<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <title>Sem conexão — Tesora</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                background: #ffffff;
                color: #000000;
                text-align: center;
                padding: 1.5rem;
            }
            main {
                max-width: 22rem;
            }
            h1 {
                font-size: 1.25rem;
                margin: 0 0 0.75rem;
            }
            p {
                margin: 0 0 1.25rem;
                color: #444;
                line-height: 1.45;
            }
            button {
                appearance: none;
                border: 0;
                border-radius: 999px;
                background: #000;
                color: #fff;
                font-weight: 600;
                padding: 0.75rem 1.5rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Você está offline</h1>
            <p>
                Conecte-se à internet para abrir o Tesora e gerenciar sua
                barbearia.
            </p>
            <button type="button" onclick="location.reload()">Tentar de novo</button>
        </main>
    </body>
</html>
